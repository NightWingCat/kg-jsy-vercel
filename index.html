<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1주차 에이전틱 과제_전수용 · v8 코코비 월드 투어 (Kigle Design System)</title>
<meta name="description" content="코코와 러비가 키글 자동차를 타고 공룡 세상, 직업 체험, 생활 습관 세계를 지나 전 세계와 우주 끝까지 달려가는 키글 스크롤 여행.">
<meta name="theme-color" content="#FFC34A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ───────── v8 · Kigle Design System (Web) 적용 ─────────
   Figma: kg-design-system › 01 Kigle Web
   - Play Palette: red #FF4A4A(행동) · yellow #FFC34A(보상) · green #30A12F(성공) · sky #4AACFF(정보) · ground #9C5843(서명)
   - 텍스트는 블랙 대신 브라운 잉크, 그림자는 브라운 틴트
   - Nunito(영문 디스플레이·숫자) + Noto Sans KR(한글·본문)
   - 모서리: 카드 lg 20 · 이미지 md 14 · 버튼/탭/배지 pill, 누를 수 있는 것엔 그라운드 섀도 */
:root{
  color-scheme:light;
  /* play palette */
  --red:#FF4A4A; --red-hover:#FF6363; --red-700:#C92F2F; --red-50:#FFF1F1;
  --yellow:#FFC34A; --yellow-100:#FFEDC4; --yellow-700:#9A6A12; --yellow-ground:#D99A1E;
  --green:#30A12F; --green-700:#1F7220; --green-50:#EEF8EE;
  --blue:#4AACFF; --blue-700:#1F6FB5; --blue-50:#EEF7FF;
  --brown:#9C5843; --brown-100:#EBDAD3; --brown-300:#C4917F; --brown-700:#6E3B2C; --brown-900:#4A2C22;
  /* ink & surface */
  --ink:#2E211C; --ink-muted:#5C4A42; --ink-subtle:#8C7B73; --ink-tertiary:#B5A79F;
  --canvas:#FFFFFF; --surface-1:#FFFBF5; --surface-2:#FFF4E6; --surface-3:#F7EEE4;
  --hairline:#F0E6DC; --hairline-strong:#E2D3C5;
  /* elevation */
  --lift:0 8px 24px rgba(156,88,67,.14); --lift-hi:0 14px 34px rgba(156,88,67,.20);
  --ground:0 4px 0 var(--hairline-strong);
  --focus:0 0 0 2px var(--blue),0 0 0 6px rgba(74,172,255,.25);
  /* radius */
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --pill:999px;
  /* type */
  --display:'Nunito','Noto Sans KR',system-ui,sans-serif; --kr:'Noto Sans KR',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.75,.15,1); --pop:cubic-bezier(.3,1.6,.5,1); --gut:max(24px,env(safe-area-inset-left,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip;background:var(--brown-900)}
body{margin:0;color:var(--ink);font-family:var(--kr);line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:clip;background:var(--brown-900)}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--pill)}
img{display:block;max-width:100%}

/* ── 스크롤 트랙: 길이만큼 스크롤하는 동안 무대는 화면에 고정 ── */
.track{position:relative;height:1500vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#8fd8ff}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

/* ── 상단 top-nav: 로고 + 여정 단계(pill tabs) ── */
.top{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:16px;padding:14px var(--gut);pointer-events:none}
.logo{pointer-events:auto;background:var(--canvas);border:2px solid var(--hairline);border-radius:var(--pill);padding:6px 16px;box-shadow:var(--ground);transition:transform .2s var(--pop)}
.logo:hover{transform:translateY(-2px)}
.logo img{height:30px;width:auto}
.route{list-style:none;margin:0;padding:6px;display:flex;gap:4px;background:rgba(255,251,245,.92);backdrop-filter:blur(8px);border:2px solid var(--hairline);border-radius:var(--pill);box-shadow:var(--lift);overflow:hidden}
.route li{display:flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--pill);font:700 13px/1 var(--kr);color:var(--ink-tertiary);white-space:nowrap;transition:background .3s,color .3s,box-shadow .3s}
.route li i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.55}
.route li.done{color:var(--ink-muted)}
.route li.done i{background:var(--c);opacity:1}
.route li.on{background:var(--c,var(--red));color:var(--on,#fff);box-shadow:0 3px 0 rgba(74,44,34,.22)}
.route li.on i{opacity:1;background:currentColor}

/* ── 인트로 (hero) + 카운트다운 ── */
.intro{position:absolute;inset:0;text-align:center;padding:15vh var(--gut) 0;pointer-events:none}
.intro__low{position:absolute;left:0;right:0;bottom:max(24px,3.5vh);display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 var(--gut)}
/* eyebrow = 로고 태그라인 스타일 */
.intro__pill{display:inline-block;margin:0 0 16px;padding:8px 18px;border-radius:var(--pill);background:var(--canvas);border:2px solid var(--hairline);box-shadow:var(--ground);font:800 13px/1.3 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--brown)}
.intro h1{margin:0;font:900 clamp(46px,8.5vw,120px)/.9 var(--display);letter-spacing:-.025em;color:#fff;text-shadow:0 6px 0 var(--red-700),0 14px 30px rgba(74,44,34,.28)}
.intro h1 span{display:block}
.intro h1 span+span{color:var(--yellow);text-shadow:0 6px 0 var(--brown-700),0 14px 30px rgba(74,44,34,.28)}
.intro__sub{margin:0;max-width:540px;font:500 18px/1.6 var(--kr);color:var(--ink);background:rgba(255,255,255,.9);border:2px solid var(--hairline);display:inline-block;padding:10px 20px;border-radius:var(--pill);box-shadow:var(--lift)}
.intro__hint{margin:0;font:800 14px var(--display);color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;text-shadow:0 2px 6px rgba(74,44,34,.4)}
.intro__hint span{width:26px;height:40px;border:3px solid #fff;border-radius:var(--r-md);position:relative}
.intro__hint span::after{content:"";position:absolute;left:50%;top:6px;width:5px;height:9px;margin-left:-2.5px;border-radius:3px;background:#fff;animation:wheel 1.4s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.count{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font:900 clamp(90px,16vw,220px)/1 var(--display);color:#fff;text-shadow:0 8px 0 var(--red-700),0 18px 40px rgba(74,44,34,.32);pointer-events:none;opacity:0}
.count.go{color:var(--yellow);text-shadow:0 8px 0 var(--green-700),0 18px 40px rgba(74,44,34,.32)}
.count.pop{animation:pop .5s var(--pop)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(-50%,-50%) scale(1)}}

/* ── 테마 세계 카드 (왼쪽) · program-card ── */
.wcard{position:absolute;left:var(--gut);top:96px;width:min(340px,calc(100vw - 2*var(--gut)));padding:20px 18px 18px;border-radius:var(--r-lg);background:rgba(255,251,245,.96);backdrop-filter:blur(10px);border:2px solid var(--hairline);box-shadow:var(--lift-hi);opacity:0;transform:translateX(-30px) scale(.96);transition:opacity .45s,transform .6s var(--pop);pointer-events:none}
.wcard.on{opacity:1;transform:none;pointer-events:auto}
.wcard__en{display:inline-block;font:800 12px/1.3 var(--display);letter-spacing:.12em;color:var(--cd,var(--brown))}
.wcard h2{margin:4px 0 6px;font:700 30px/1.25 var(--kr);letter-spacing:-.02em;color:var(--ink)}
.wcard p{margin:0 0 14px;font:400 14px/1.6 var(--kr);color:var(--ink-muted)}
.wcard__apps{display:grid;gap:8px}
.app{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;min-height:64px;padding:8px 10px 8px 8px;border-radius:var(--r-lg);background:var(--canvas);border:2px solid var(--hairline);box-shadow:var(--ground);transition:transform .25s var(--pop),box-shadow .25s}
.app:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--hairline-strong)}
.app:active{transform:translateY(2px);box-shadow:0 1px 0 var(--hairline-strong)}
.app img{width:48px;height:48px;border-radius:var(--r-md)}
.app b{display:block;font:700 15px/1.3 var(--kr);color:var(--ink)}
.app small{font:500 12px var(--kr);color:var(--ink-subtle)}
.app em{font-style:normal;font:800 11.5px/1 var(--display);color:var(--on,#fff);background:var(--c);padding:8px 11px;border-radius:var(--pill);white-space:nowrap;box-shadow:0 3px 0 var(--cd,rgba(74,44,34,.25))}

/* ── 유튜브 카드 (오른쪽) ── */
.ycard{position:absolute;right:var(--gut);top:96px;width:min(340px,calc(100vw - 2*var(--gut)));padding:16px;border-radius:var(--r-lg);background:rgba(255,251,245,.96);backdrop-filter:blur(10px);border:2px solid var(--hairline);box-shadow:var(--lift-hi);opacity:0;transform:translateX(30px) scale(.96);transition:opacity .45s .15s,transform .6s var(--pop) .15s,box-shadow .3s;pointer-events:none}
.ycard.on{opacity:1;transform:none;pointer-events:auto}
.ycard__top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ycard__logo{display:flex;align-items:center;gap:7px;font:900 16px var(--display);color:var(--ink)}
.ycard__logo i{width:26px;height:18px;border-radius:6px;background:#FF0033;display:grid;place-items:center}
.ycard__logo i::before{content:"";border-left:7px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;margin-left:2px}
.ycard__top a{font:700 12px var(--kr);color:var(--brown-700);text-decoration:underline;text-underline-offset:3px}
.ycard__list{display:grid;gap:10px}
.yv{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center;padding:6px;border-radius:var(--r-lg);background:var(--canvas);border:2px solid var(--hairline);box-shadow:var(--ground);transition:transform .25s var(--pop),box-shadow .25s}
.yv:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--hairline-strong)}
.yv__th{position:relative;display:block;aspect-ratio:16/9;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-3)}
.yv__th img{width:100%;height:100%;object-fit:cover}
.yv__th i{position:absolute;left:50%;top:50%;width:30px;height:21px;margin:-10.5px 0 0 -15px;border-radius:6px;background:#FF0033;display:grid;place-items:center}
.yv__th i::before{content:"";border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.yv small{display:inline-block;font:700 11px/1 var(--kr);color:var(--brown-700);background:var(--yellow-100);padding:4px 8px;border-radius:var(--pill);margin-bottom:4px}
.yv b{display:block;font:700 14px/1.35 var(--kr);color:var(--ink)}
.yv em{font-style:normal;font:500 11.5px var(--kr);color:var(--ink-subtle)}
/* 지나가는 간판 종류에 맞춰 반짝 (focus ring 계열) */
.wcard.hot{box-shadow:0 0 0 4px var(--c),var(--lift-hi)}
.ycard.hot{box-shadow:0 0 0 4px #FF0033,var(--lift-hi)}

/* ── 카드 등장 연출 ──
   세계가 바뀌면: 카드가 옆에서 튀어 들어오고 → 제목이 톡 → 항목이 하나씩 → 빛줄기가 훑고 지나감
   간판을 지날 때: 해당 카드가 통통 튀며 테두리 물결 */
.wcard,.ycard{overflow:hidden}
.wcard::before,.ycard::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);transform:translateX(-130%)}
.wcard::after,.ycard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 0 var(--ring,rgba(255,74,74,.55))}
.ycard{--ring:rgba(255,0,51,.5)}
@keyframes cardInL{0%{opacity:0;transform:translateX(-90px) rotate(-7deg) scale(.78)}55%{opacity:1;transform:translateX(12px) rotate(1.5deg) scale(1.04)}80%{transform:translateX(-3px) rotate(-.4deg) scale(.99)}100%{opacity:1;transform:none}}
@keyframes cardInR{0%{opacity:0;transform:translateX(90px) rotate(7deg) scale(.78)}55%{opacity:1;transform:translateX(-12px) rotate(-1.5deg) scale(1.04)}80%{transform:translateX(3px) rotate(.4deg) scale(.99)}100%{opacity:1;transform:none}}
@keyframes cardUp{0%{opacity:0;transform:translateY(50px) scale(.86)}60%{opacity:1;transform:translateY(-6px) scale(1.03)}100%{opacity:1;transform:none}}
@keyframes itemIn{0%{opacity:0;transform:translateY(18px) scale(.82)}70%{opacity:1;transform:translateY(-3px) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes titleIn{0%{opacity:0;transform:translateY(10px) scale(.6)}60%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:none}}
@keyframes sweep{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
@keyframes bump{0%{transform:none}30%{transform:scale(1.06) rotate(-1.2deg)}60%{transform:scale(.98) rotate(.4deg)}100%{transform:none}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--ring)}100%{box-shadow:0 0 0 22px transparent}}
.wcard.enter{animation:cardInL .8s var(--ease) backwards}
.ycard.enter{animation:cardInR .8s var(--ease) .14s backwards}
.wcard.enter h2,.ycard.enter .ycard__top{animation:titleIn .6s var(--pop) .2s backwards}
.wcard.enter .wcard__en,.wcard.enter p{animation:itemIn .5s var(--ease) .28s backwards}
.wcard.enter .app,.ycard.enter .yv{animation:itemIn .55s var(--pop) backwards;animation-delay:calc(.38s + var(--i,0) * .11s)}
.wcard.enter::before{animation:sweep .9s .55s ease-out}
.ycard.enter::before{animation:sweep .9s .7s ease-out}
.wcard.bump,.ycard.bump{animation:bump .55s var(--pop)}
.wcard.bump::after,.ycard.bump::after{animation:ring .8s ease-out}
.wcard.bump .app,.ycard.bump .yv{animation:itemIn .45s var(--pop) backwards;animation-delay:calc(var(--i,0) * .07s)}

/* ── 지도 핀 카드 (오른쪽) + 숫자 ── */
.pcard{position:absolute;right:var(--gut);top:96px;width:min(330px,calc(100vw - 2*var(--gut)));display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:16px;border-radius:var(--r-lg);background:rgba(255,251,245,.97);border:2px solid var(--hairline);box-shadow:var(--lift-hi);opacity:0;transform:translateY(-14px);transition:opacity .35s,transform .5s var(--pop);pointer-events:none}
.pcard.on{opacity:1;transform:none}
.pcard__flag{min-width:68px;padding:10px 12px;border-radius:var(--r-sm) var(--r-md) var(--r-md) 4px;background:var(--c);color:var(--on,#fff);font:900 15px/1.2 var(--display);text-align:center;box-shadow:0 4px 0 rgba(74,44,34,.22)}
.pcard b{font:700 21px/1.3 var(--kr);color:var(--ink)}
.pcard p{margin:4px 0 0;font:400 13.5px/1.6 var(--kr);color:var(--ink-muted)}
.pcard__rank{display:inline-block;margin-top:6px;font:800 12px var(--display);color:var(--ink-subtle)}
.pcard__rank:empty{display:none}
.stats{position:absolute;left:var(--gut);bottom:22px;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100vw - 2*var(--gut) - 160px);pointer-events:none}
.stat{padding:12px 16px;border-radius:var(--r-lg);background:rgba(255,251,245,.96);border:2px solid var(--hairline);box-shadow:var(--lift);opacity:0;transform:translateY(20px) scale(.9);transition:opacity .4s calc(var(--i)*90ms),transform .6s var(--pop) calc(var(--i)*90ms)}
.stats.on .stat{opacity:1;transform:none}
.stat b{font:900 28px/1 var(--display);letter-spacing:-.02em;color:var(--red)}
.stat:nth-child(2) b{color:var(--green)}
.stat:nth-child(3) b{color:var(--blue-700)}
.stat:nth-child(4) b{color:var(--brown)}
.stat b sup{font:700 .5em var(--kr);margin-left:2px}
.stat span{display:block;margin-top:4px;font:500 12px var(--kr);color:var(--ink-muted)}

/* ── 속도계 (inverse surface) ── */
.speedo{position:absolute;right:var(--gut);bottom:20px;width:136px;padding:12px 12px 10px;border-radius:var(--r-lg);background:rgba(74,44,34,.82);backdrop-filter:blur(6px);border:2px solid rgba(235,218,211,.18);color:#fff;text-align:center;pointer-events:none}
.speedo svg{width:100%;height:auto;display:block}
.speedo b{display:block;margin-top:-30px;font:900 30px/1 var(--display);font-variant-numeric:tabular-nums}
.speedo span{font:800 10px var(--display);letter-spacing:.14em;color:var(--brown-100)}

/* ── 마지막 카드 (cta-banner) ── */
.end{position:absolute;left:50%;top:50%;width:min(600px,calc(100vw - 2*var(--gut)));transform:translate(-50%,-44%) scale(.9);text-align:center;opacity:0;pointer-events:none;transition:opacity .5s,transform .8s var(--pop)}
.end.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.end h2{margin:0;font:700 clamp(38px,6vw,80px)/1.15 var(--kr);letter-spacing:-.03em;color:#fff;text-shadow:0 6px 0 var(--red-700),0 14px 40px rgba(0,0,0,.45)}
.end h2 span{display:block}
.end p{margin:18px 0 0;font:800 clamp(13px,1.6vw,16px)/1.4 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)}
.end__links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
/* button-secondary */
.end__links a{display:inline-flex;align-items:center;height:56px;padding:0 26px;border-radius:var(--pill);background:var(--canvas);border:2px solid var(--hairline-strong);font:700 16px/1 var(--kr);color:var(--ink);box-shadow:0 4px 0 var(--hairline-strong);transition:transform .2s var(--pop),box-shadow .2s,background .2s}
.end__links a:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--hairline-strong)}
.end__links a:active{transform:translateY(3px);box-shadow:0 1px 0 var(--hairline-strong)}
/* button-primary */
.end__links a:first-child{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-700)}
.end__links a:first-child:hover{background:var(--red-hover);border-color:var(--red-hover);box-shadow:0 6px 0 var(--red-700)}
.end__links a:first-child:active{background:#E63E3E;box-shadow:0 1px 0 var(--red-700)}
.end .end__again{margin-top:24px;font:500 13px var(--kr);letter-spacing:0;text-transform:none;color:rgba(255,255,255,.75)}

/* ── footer (inverse canvas) ── */
.foot{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:24px var(--gut);background:var(--brown-900);color:var(--brown-100);font:400 13px/1.6 var(--kr)}
.foot a{font:800 13px var(--display);color:var(--yellow);text-decoration:underline;text-underline-offset:3px}

@media (max-width:820px){
  .route li span{display:none}
  .route li{padding:0 10px}
  .route li.on span{display:inline}
  .wcard{top:auto;bottom:118px;padding:14px}
  .wcard h2{font-size:24px}
  .wcard p{display:none}
  .wcard__apps{grid-auto-flow:column;grid-auto-columns:80%;overflow-x:auto;scrollbar-width:none}
  .pcard{top:auto;bottom:118px;left:var(--gut);right:var(--gut);width:auto}
  .ycard{top:auto;bottom:118px;left:var(--gut);right:var(--gut);width:auto;padding:14px}
  .ycard__list{grid-auto-flow:column;grid-auto-columns:88%;overflow-x:auto;scrollbar-width:none}
  .yv{grid-template-columns:96px 1fr}
  /* 좁은 화면: 앱 카드와 유튜브 카드를 번갈아 */
  .stage[data-focus="yt"] .wcard.on,.stage:not([data-focus="yt"]) .ycard.on{opacity:0;transform:translateY(16px) scale(.96);pointer-events:none}
  .wcard.enter,.ycard.enter,.wcard.bump,.ycard.bump{animation:cardUp .6s var(--pop) backwards}
  .intro__low{bottom:128px}
  .intro__sub{font-size:15px;border-radius:var(--r-lg)}
  .stats{bottom:auto;top:76px;max-width:none;right:var(--gut);gap:6px}
  .stat{padding:8px 11px}.stat b{font-size:19px}.stat span{font-size:10.5px}

@media (max-width:480px){
  :root{--gut:max(16px,env(safe-area-inset-left,0px))}
  .end__links a{flex:1 1 100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001ms!important;animation-duration:.001ms!important}
}

/* ───────── 도로 위 스토리 (말풍선 · 효과음) ───────── */
.story{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.sbub{position:absolute;left:0;top:0;max-width:min(260px,58vw);padding:9px 16px 10px;border-radius:var(--r-lg);background:#fff;color:var(--ink);font:700 17px/1.35 var(--kr);border:3px solid var(--ink);box-shadow:0 5px 0 rgba(46,33,28,.18);white-space:nowrap;opacity:0;transition:opacity .18s;will-change:transform}
.sbub::after{content:"";position:absolute;left:50%;bottom:-13px;width:18px;height:18px;margin-left:-9px;background:#fff;border:3px solid var(--ink);border-top:0;border-left:0;transform:rotate(45deg) skew(8deg,8deg)}
.sbub.on{opacity:1}
.sbub.think{background:var(--surface-2);border-radius:var(--pill);border-style:dashed}
.sbub.think::after{width:12px;height:12px;bottom:-22px;margin-left:-6px;border:3px solid var(--ink);border-radius:50%;transform:none;background:var(--surface-2);box-shadow:-10px 12px 0 -3px var(--surface-2),-10px 12px 0 0 var(--ink)}
.boom{position:absolute;left:50%;top:40%;padding:26px 40px;font:900 clamp(38px,6vw,76px)/1 var(--display);color:#fff;letter-spacing:-.01em;white-space:nowrap;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink);opacity:0;z-index:1}
.boom::before{content:"";position:absolute;inset:-14px -26px;z-index:-1;background:var(--c,var(--yellow));clip-path:polygon(50% 0,58% 22%,78% 4%,74% 30%,100% 26%,82% 48%,100% 66%,74% 66%,80% 96%,58% 78%,48% 100%,40% 78%,16% 94%,24% 66%,0 70%,16% 48%,0 24%,26% 30%,22% 4%,42% 22%)}

/* 마지막 화면: 우주복 + 시바견이 화면을 둥둥 */
.floater{position:absolute;left:0;top:0;z-index:12;width:clamp(190px,27vw,380px);pointer-events:none;opacity:0;transition:opacity .6s;animation:drift 24s ease-in-out infinite;animation-play-state:paused}
.floater.on{opacity:1;animation-play-state:running}
.floater__in{position:relative;animation:bob 3.2s ease-in-out infinite,tilt 7s ease-in-out infinite}
.floater img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45))}
.floater__say{position:absolute;left:4%;top:-15%;padding:8px 16px 9px;border-radius:var(--pill);background:var(--yellow);color:var(--ink);border:3px solid var(--ink);font:700 clamp(18px,2.2vw,28px)/1.2 var(--kr);white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,.25);animation:shout 1.6s ease-in-out infinite;transform-origin:0 100%}
.floater__say::after{content:"";position:absolute;left:42%;bottom:-12px;width:14px;height:14px;background:var(--yellow);border:3px solid var(--ink);border-top:0;border-left:0;transform:rotate(45deg)}
@keyframes drift{
  0%,100%{transform:translate(3vw,13vh)}
  22%{transform:translate(calc(100vw - 100% - 4vw),9vh)}
  30%{transform:translate(calc(100vw - 100% - 2vw),32vh)}
  50%{transform:translate(calc(100vw - 100% - 10vw),calc(100vh - 100% - 9vh))}
  72%{transform:translate(5vw,calc(100vh - 100% - 4vh))}
  82%{transform:translate(1vw,40vh)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes tilt{0%,100%{rotate:-9deg}50%{rotate:9deg}}
@keyframes shout{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.12) rotate(3deg)}}
@media (max-width:700px){
  .floater{width:46vw}
  .sbub{font-size:15px;padding:7px 12px 8px}
}
@media (prefers-reduced-motion:reduce){.floater,.floater__in,.floater__say{animation:none}.floater{transform:translate(4vw,12vh)}}
</style>

     5) 마지막 화면: 우주복 + 시바견이 "화성가즈아!" 외치며 화면을 둥둥 떠다님

   다른 회사 게임 캐릭터는 쓰지 않고, 느낌만 살린 오리지널 '네모 블록 친구'로 대신합니다. */

  const { THREE, world, J } = ctx;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t), seg = (v, a, b) => clamp((v - a) / (b - a));
  const INK = '#2E211C', SKIN = '#FFD9BE';

  /* ───────── 캔버스 그리기 도구 ───────── */
  const cvs = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  function E(g, x, y, rx, ry, f, s, lw = 6, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); if (f) { g.fillStyle = f; g.fill(); } if (s) { g.strokeStyle = s; g.lineWidth = lw; g.stroke(); } }
  function RR(g, x, y, w, h, r, f, s, lw = 6) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); if (f) { g.fillStyle = f; g.fill(); } if (s) { g.strokeStyle = s; g.lineWidth = lw; g.stroke(); } }
  function P(g, pts, f, s, lw = 6) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 6) g.bezierCurveTo(pts[i], pts[i + 1], pts[i + 2], pts[i + 3], pts[i + 4], pts[i + 5]); g.closePath(); if (f) { g.fillStyle = f; g.fill(); } if (s) { g.strokeStyle = s; g.lineWidth = lw; g.lineJoin = 'round'; g.stroke(); } }
  function line(g, pts, c, lw) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.strokeStyle = c; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(); }

    else { g.beginPath(); g.arc(180, 240, 22, Math.PI * .18, Math.PI * .82); g.strokeStyle = INK; g.lineWidth = 6; g.lineCap = 'round'; g.stroke(); }
    if (o.prop) o.prop(g);
    return c;

  const glow = (() => { const c = cvs(128, 128), g = c.getContext('2d'); const r = g.createRadialGradient(64, 64, 2, 64, 64, 64); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.3, 'rgba(255,240,160,.9)'); r.addColorStop(1, 'rgba(255,220,120,0)'); g.fillStyle = r; g.fillRect(0, 0, 128, 128); return tex(c); })();
  const twinkle = () => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); s.scale.setScalar(.001); return s; };

  // 1) 네모 블록 친구 차
  const npcA = car('#F28C28'); const drvA = sprite(BLOCK_A, 1.9); drvA.position.set(0, 1.0, .3); npcA.add(drvA);

  /* ───────── DOM: 말풍선 · 생각풍선 · 효과 글자 · 마지막 화면 ───────── */

  /* ───────── 매 프레임 ───────── */
  function update(o) {

      } else tvJ.scale.setScalar(.001); }

    /* 4) 반도체 차 + 시바견 라이더를 쌍으로 */
    { const e = (d - 662) / 100; const on = e > -.02 && e < 1.02; show(npcL, on); rider.visible = on;
      if (on) {
        const k = seg(e, .55, 1), a = smooth(clamp(e / .55)); out.camUp = win(e, .05, .9) * 2.2;

          rider.position.set(lerp(-3.8, -1.3, a), Math.abs(Math.sin(t * 9)) * .45, cz + lerp(-30, -4.6, a)); rider.material.rotation = 0; rider.scale.set(3.6 * ELON_RIDE.width / ELON_RIDE.height, 3.6, 1); }

  /* 카메라가 정해진 뒤: 말풍선을 화면 좌표로 */
